name: CI - Customer Churn Prediction

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:

  ml-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Install DVC
        run: |

          pip install dvc


      - name: Verify environment
        run: |

          python --version

          dvc --version

          python -c "import xgboost; print('XGBoost installed')"

          python -c "import shap; print('SHAP installed')"


      - name: Run DVC pipeline
        run: |

          dvc repro


      - name: Verify model
        run: |

          test -f data/output/xgb_model.pkl

          echo "XGBoost model generated successfully."


      - name: Verify evaluation
        run: |

          test -f reports/metrics.json

          test -f reports/predictions.csv

          test -f reports/threshold.txt

          test -f reports/confusion_matrix.png

          echo "Evaluation completed successfully."


      - name: Verify SHAP
        run: |

          test -f reports/shap_summary.png

          test -f reports/shap_feature_importance.csv

          test -f reports/shap_feature_importance.png

          echo "SHAP analysis completed successfully."


      - name: Upload reports
        uses: actions/upload-artifact@v4

        with:
          name: customer-churn-reports

          path: reports/


  docker:

    runs-on: ubuntu-latest

    needs: ml-pipeline

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |

          docker build \
            -t customer-churn:latest \
            .


      - name: Run Docker container
        run: |

          docker run --rm \
            customer-churn:latest